name = "meridian-ai-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }

# AI Binding for Cloudflare Workers AI
[ai]
binding = "AI"

# 与 backend 同一个 bucket：写入 llm-calls/{trace_id}/{phase}-{idx}.json 用于 eval
[[r2_buckets]]
binding = "ARTICLES_BUCKET"
bucket_name = "meridian-articles-prod"
# 本地 wrangler dev 直连线上桶（remote binding，需 wrangler >= 4.37；
# 本目录 package.json 仍锁 3.x，跑 dev 请用 apps/backend/node_modules/.bin/wrangler）。
# 不加 remote 时 dev 走 miniflare 模拟桶，而 `wrangler r2 object put` 写的是另一套
# 扁平 blobs 目录，两边互不可见——文章正文永远加载不进来，证据链只能空跑。
# preview_bucket_name 一并删掉：它优先于 bucket_name 生效，会把 dev 指向空的
# meridian-articles-dev；正文只在 prod 桶里。代价是本地 dev 的写入也落生产桶。
remote = true

# span 落盘里的 deployment_version 取自这里。原型用 git HEAD 标版本，生产没有 git，
# CF 的 version_metadata 给的是这次**部署**的 version id——同一个 commit 重部署两次会变，
# 所以它只能当"哪次部署"读，不能当"哪版代码"读（span 里另有 runtime_env 区分本地/生产）。
[version_metadata]
binding = "CF_VERSION_METADATA"

# wrangler.toml (wrangler v3.88.0^)
[observability.logs]
enabled = true




# Environment variables (set these using wrangler secret put)
# Required:
# CLOUDFLARE_ACCOUNT_ID
# CLOUDFLARE_GATEWAY_ID  
# CLOUDFLARE_API_TOKEN
# OPENAI_API_KEY

# Optional Provider API Keys:
# ANTHROPIC_API_KEY
# GOOGLE_AI_API_KEY

# AI Gateway Enhanced Features (optional):
# AI_GATEWAY_AUTH_TOKEN - AI Gateway authentication token for enhanced security
# AI_GATEWAY_ENABLE_COST_TRACKING - Enable automatic cost tracking (true/false)
# AI_GATEWAY_ENABLE_CACHING - Enable intelligent caching (true/false)
# AI_GATEWAY_DEFAULT_CACHE_TTL - Default cache TTL in seconds (default: 3600)
# AI_GATEWAY_ENABLE_METRICS - Enable enhanced metrics collection (true/false)
# AI_GATEWAY_ENABLE_LOGGING - Enable detailed logging (true/false)

# Note: ML Service integration has been decoupled from AI Worker
# For clustering functionality, directly call meridian-ml-service endpoints

