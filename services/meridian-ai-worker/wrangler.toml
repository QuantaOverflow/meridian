name = "meridian-ai-worker"
main = "src/index.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

# 不开 *.workers.dev 公网地址：唯一的生产调用方 backend 走 service binding（AI_WORKER），
# 公网口此前全无鉴权（/meridian/chat 可直接烧 LLM 额度）。eval 脚本默认打本地 wrangler dev。
workers_dev = false

# AI Binding for Cloudflare Workers AI
[ai]
binding = "AI"

# 本次部署的版本 id 与时刻，GET /meridian/version 读（提交哈希与标题由 scripts/deploy.sh 用 --var 注入）
[version_metadata]
binding = "CF_VERSION_METADATA"

# 与 backend 同一个 bucket：写入 llm-calls/{trace_id}/{phase}-{idx}.json 用于 eval
[[r2_buckets]]
binding = "ARTICLES_BUCKET"
bucket_name = "meridian-articles-prod"
# 本地 wrangler dev 直连线上桶（remote binding，需 wrangler >= 4.37；本包依赖 ^4.141.0）。
# ai-worker 只往桶里写 LLM 调用日志（llm-calls/、sensor 日志），不读。
# 代价是本地 dev 的写入也落生产桶。
remote = true

# 日志与 trace 全量（采样率 1），取值与用量/费用依据见 docs/monitoring.md 的 Logs & traces。
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1




# BRIEF_CHECK_MODE 是 agent 时不需要 secret；切到 one_call 要先放 DASHSCOPE_API_KEY（网关开了鉴权再加 AI_GATEWAY_TOKEN）。
[vars]
# 逐句核查的 epoch 数（写作–核查循环，ADR 0010）：每句独立核查几次，任一次判有问题就改写。
# "0" = 不核查、不改写，只留 v4-pro 写作（回滚开关）；缺省或非法值按 1。改它不用改代码。
BRIEF_CHECK_EPOCHS = "1"
# 逐句核查怎么做（ADR 0012）："agent" = 逐句 agent（ADR 0010）；"one_call" = 代码取证据 + DashScope 一次调用，失败的句子回退到 agent。
# 缺省或写错按 agent 并打 warn。2026-10-06 满负荷干跑通过后切到 "one_call"；要退回原来的做法改成 "agent" 再部署，不用回滚代码。
BRIEF_CHECK_MODE = "one_call"
# DashScope 的 OpenAI 兼容入口（经 Cloudflare AI Gateway 的 custom provider），只有 one_call 核查用。
# 网关是 meridian-gateway（生产一直用的那个，开了鉴权；另一个 meridian-ai 是本机开发用的，别混，免得两边的日志和用量搅在一起）。
# 2026-10-06 用一条小请求验过：custom provider `dashscope` 在、带网关 token 能通、不带是 401。
# key 与网关 token 是 secret（DASHSCOPE_API_KEY / AI_GATEWAY_TOKEN），不写在这里。
DASHSCOPE_BASE_URL = "https://gateway.ai.cloudflare.com/v1/c8317cfcb330d45b37b00ccd7e8a9936/meridian-gateway/custom-dashscope/compatible-mode/v1"

# ---------- Staging 环境（ADR 0013）----------
# `../../scripts/deploy.sh --env staging` 部署成 meridian-ai-worker-staging。binding 与 vars 不从顶层继承，每一项都要自己写；
# workers_dev、observability、compatibility_* 从顶层继承。把生产的资源名抄进来由 scripts/check-staging-isolation.mjs 拦。
# secret 要单独放一遍：wrangler secret put DASHSCOPE_API_KEY --env staging（AI_GATEWAY_TOKEN 同）。

[env.staging.ai]
binding = "AI"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.staging.r2_buckets]]
binding = "ARTICLES_BUCKET"
bucket_name = "meridian-articles-staging"

[env.staging.vars]
BRIEF_CHECK_EPOCHS = "1"
BRIEF_CHECK_MODE = "one_call"
# staging 走 meridian-ai 网关（本机开发用的那个），不进生产的 meridian-gateway，生产的日志与用量不被搅进来
DASHSCOPE_BASE_URL = "https://gateway.ai.cloudflare.com/v1/c8317cfcb330d45b37b00ccd7e8a9936/meridian-ai/custom-dashscope/compatible-mode/v1"
