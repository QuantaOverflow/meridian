name = "meridian-reader"
compatibility_date = "2025-04-30"
compatibility_flags = ["nodejs_compat"]

# 指定构建输出目录
pages_build_output_dir = "apps/frontend/dist"


# 生产环境变量
[env.production.vars]
NUXT_PUBLIC_WORKER_API = "https://meridian-backend.swj299792458.workers.dev"
NUXT_PUBLIC_ENVIRONMENT = "production"

# Staging：往 Pages 的 `staging` 分支部署就用 preview 环境，变量指向 staging backend，页面顶部有 STAGING 横幅且不收录。
# preview 的 secret 要单独放，production 的不会带过来：
#   wrangler pages secret put NUXT_SESSION_PASSWORD --env preview
#   （NUXT_WORKER_API_TOKEN 用 staging backend 的新 token；NUXT_ADMIN_USERNAME / NUXT_ADMIN_PASSWORD 同理，都加 --env preview）
[env.preview.vars]
NUXT_PUBLIC_WORKER_API = "https://meridian-backend-staging.swj299792458.workers.dev"
NUXT_PUBLIC_ENVIRONMENT = "staging"

# 密钥不入库。生产值用 Pages secret 设置；本地放 apps/frontend/.env（已 gitignored）：
# 运行时只认 NUXT_ 前缀（nuxt.config 里的 process.env.X 只在构建时读）。
# 前端不再连数据库（数据都经 backend），不再需要 NUXT_DATABASE_URL；新版前端部署后可删掉该 Pages secret：
#   wrangler pages secret delete NUXT_DATABASE_URL
# 仍需要的：
#   wrangler pages secret put NUXT_SESSION_PASSWORD
#   wrangler pages secret put NUXT_WORKER_API_TOKEN
#   wrangler pages secret put NUXT_ADMIN_USERNAME
#   wrangler pages secret put NUXT_ADMIN_PASSWORD