name = "meridian-reader"
compatibility_date = "2025-04-30"
compatibility_flags = ["nodejs_compat"]

# 指定构建输出目录
pages_build_output_dir = "apps/frontend/dist"


# 生产环境变量
[env.production.vars]
NUXT_PUBLIC_WORKER_API = "https://meridian-backend.swj299792458.workers.dev"

# 密钥不入库。生产值用 Pages secret 设置；本地放 apps/frontend/.env（已 gitignored）：
# 运行时只认 NUXT_ 前缀（nuxt.config 里的 process.env.X 只在构建时读）：
#   wrangler pages secret put NUXT_DATABASE_URL
#   wrangler pages secret put NUXT_SESSION_PASSWORD
#   wrangler pages secret put NUXT_WORKER_API_TOKEN
#   wrangler pages secret put NUXT_ADMIN_USERNAME
#   wrangler pages secret put NUXT_ADMIN_PASSWORD